<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitStats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha256-tXCrvaljxgtN5LT/Syb5Mm9T+yzPFGH98JVcoJT7JTk=" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dashboard-surface">
    <main id="app-root">
        <section id="view-dashboard" class="view dashboard-view active">
            <section class="dashboard-atlas-hero is-loading" aria-label="Your transit atlas">
                <div id="main-map" class="dashboard-map"></div>
                <div class="dashboard-map-wash" aria-hidden="true"></div>
                <div class="dashboard-map-loading" id="dashboard-map-loading" role="status">Mapping your rides…</div>

                <div class="dashboard-atlas-hero-inner">
                    <div class="atlas-identity-card">
                        <div class="atlas-card-topline">
                            <span class="atlas-card-type">TransitStats</span>
                            <span class="atlas-card-tagline">Your transit life, mapped.</span>
                        </div>
                        <h1><span id="profile-name">Traveler</span><span class="atlas-title-tail">'s map</span></h1>
                        <p id="profile-status" class="atlas-profile-status" hidden></p>
                        <div class="atlas-hero-count">
                            <strong id="stat-trips-lifetime">0</strong>
                            <span>total rides</span>
                        </div>
                        <div class="atlas-card-period" aria-label="Recent trip totals">
                            <div class="atlas-period-heading"><span>Recent movement</span></div>
                            <div class="atlas-period-grid">
                                <div class="atlas-fact atlas-fact-week"><strong id="stat-trips-week">0</strong><span>Rides this week</span></div>
                                <div class="atlas-fact atlas-fact-month"><strong id="stat-trips-month">0</strong><span>Rides this month</span></div>
                                <div class="atlas-fact atlas-fact-days"><strong id="stat-days-ridden">0</strong><span>Days ridden</span></div>
                                <div class="atlas-fact atlas-fact-agencies"><strong id="stat-agencies-ridden">0</strong><span>Agencies</span></div>
                                <div class="atlas-fact atlas-fact-countries"><strong id="stat-countries-ridden">0</strong><span>Countries</span></div>
                            </div>
                        </div>
                        <button id="atlas-share-map" class="atlas-card-cta" type="button">Share your map <span aria-hidden="true">→</span></button>
                    </div>
                </div>
            </section>

        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <!-- Edit Trip Modal -->
    <div id="modal-edit-trip" class="modal hidden">
        <div class="modal-header">
            <h2>Edit Trip</h2>
            <button class="btn-close" data-close-modal><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="edit-trip-id">
            <div class="form-group mb-3">
                <label>Route Number / Name</label>
                <input type="text" id="edit-route">
            </div>
            <div class="form-group mb-3">
                <label>Boarding Stop</label>
                <input type="text" id="edit-start-stop">
            </div>
            <div class="form-group mb-3">
                <label>Exiting Stop</label>
                <input type="text" id="edit-end-stop">
            </div>
            <div class="form-group mb-3">
                <label>Direction</label>
                <select id="edit-direction" class="modal-select">
                    <option value="">Unknown / not recorded</option>
                    <option value="Northbound">Northbound</option>
                    <option value="Southbound">Southbound</option>
                    <option value="Eastbound">Eastbound</option>
                    <option value="Westbound">Westbound</option>
                    <option value="Inbound">Inbound</option>
                    <option value="Outbound">Outbound</option>
                    <option value="Clockwise">Clockwise</option>
                    <option value="Counterclockwise">Counterclockwise</option>
                    <option value="__other__">Other</option>
                </select>
                <input type="text" id="edit-direction-other" class="hidden mt-4" placeholder="Enter the direction">
            </div>
            <div class="form-group mb-3">
                <label>Vehicle (Number / Name)</label>
                <input type="text" id="edit-vehicle" placeholder="e.g. 7109">
            </div>
            <div class="form-group mb-4">
                <label>Agency</label>
                <div class="agency-autocomplete">
                    <input type="text" id="edit-agency" autocomplete="off" placeholder="Search agencies">
                </div>
            </div>
            <div class="modal-footer-actions">
                <button id="btn-save-edit" class="btn btn-primary full-width mb-3">Save Changes</button>
                <button id="btn-delete-trip" class="btn btn-danger-outline full-width">Delete Trip</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
