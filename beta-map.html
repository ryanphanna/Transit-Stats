<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitStats — Trip Paths Beta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha256-tXCrvaljxgtN5LT/Syb5Mm9T+yzPFGH98JVcoJT7JTk=" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/pages/beta-map.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main id="app-root">
        <section class="view beta-map-view active">
            <div id="beta-map" class="beta-full-map"></div>
            <div class="beta-map-controls">
                <div class="beta-map-control-groups">
                    <div class="beta-map-pills" aria-label="Heatmap points">
                        <button class="pill" data-filter="boarding">Boarding</button>
                        <button class="pill" data-filter="exiting">Exiting</button>
                        <button class="pill active" data-filter="both">Both</button>
                    </div>
                    <div class="beta-map-pills" aria-label="Map display">
                        <button class="pill active" data-view="paths">Trip paths</button>
                        <button class="pill" data-view="points">Points</button>
                    </div>
                </div>
                <span class="beta-map-label">Trip paths beta</span>
            </div>
            <div id="beta-map-diagnostics" class="beta-map-diagnostics" aria-live="polite">
                <strong>Stop locations</strong>
                <span>Loading Atlas matches…</span>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script type="module" src="js/pages/beta-map.js"></script>
</body>
</html>
