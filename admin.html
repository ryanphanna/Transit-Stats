<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitStats — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-surface">
    <main id="app-root">
        <section id="view-admin" class="view admin-view active">
            <div class="container admin-container">
                <div class="admin-page-intro">
                    <p class="page-kicker">Admin</p>
                    <h1>At a glance</h1>
                    <p>System signals and account-level metrics.</p>
                </div>
                <section class="admin-overview" aria-labelledby="admin-overview-title">
                    <div class="admin-overview-header">
                        <div>
                            <p class="page-kicker">System overview</p>
                            <h2 id="admin-overview-title">What needs attention</h2>
                            <p>Matching and processing signals from your account.</p>
                        </div>
                        <span class="admin-metrics-updated" data-admin-metrics-updated>Loading…</span>
                    </div>
                    <div class="admin-metrics" data-admin-metrics>
                        <p class="loading-state">Loading system metrics…</p>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <script type="module" src="js/pages/admin.js"></script>
</body>
</html>
